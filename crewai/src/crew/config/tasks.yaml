analysis_task:
  description: >
    Usa obligatoriamente 'Buscar Tarea en Linear'
    para obtener '{ticket_id}'. El supervisor calculó el hash SHA-256 del
    ticket serializado: '{ticket_sha256}'. El contrato debe usar exactamente
    ticket_id='{ticket_id}', change_id='{change_id}' y ese ticket_sha256.

    Produce exclusivamente un TicketContract fiel al ticket, con objetivo,
    alcance, criterios de aceptación con IDs AC-*, restricciones,
    dependencias y ambigüedades. No inventes información.
    Contrato JSON exacto TicketContract, con estas claves y tipos:
    `schema_version` (integer literal 1), `ticket_id` (string), `change_id`
    (string), `ticket_sha256` (string), `acceptance_criteria` (array of
    objects with `id` (string) and `text` (string)), `objective` (string),
    `in_scope` (array of strings), `constraints` (array of strings),
    `dependencies` (array of strings) y `ambiguities` (array of strings).
    Responde con exactamente un objeto JSON que coincida con TicketContract,
    sin prosa ni bloques Markdown. Values must be valid JSON literals only.
    Do not use JavaScript or Python expressions such as `.replace(...)`. Do
    not invent localized key names. Do not add extra prose or Markdown.
  expected_output: >
    Un TicketContract válido.
  agent: analyst


architect_outline_task:
  description: >
    Diseña exclusivamente el outline de un cambio OpenSpec usando este
    TicketContract JSON:
    {ticket_contract_json}

    Índice de contexto sin cuerpos:
    {context_index}

    Devuelve exclusivamente un PlanOutline con profile, acceptance_map y una
    PlanUnitOutline para proposal, design, tasks y cada spec requerida. Cada
    unidad selecciona solo referencias conocidas del índice. No uses herramientas,
    no escribas archivos y no calcules hashes: el supervisor
    persiste y valida el resultado.
    Contrato JSON exacto PlanOutline, con estas claves y tipos:
    `schema_version` (integer literal 1), `profile` (string literal: standard,
    browser, operational, or browser_operational), `units` (array of objects
    with `artifact` (string literal: proposal, design, tasks, or spec), optional `capability` (string or
    null), `objective` (string), and `context_refs` (array of strings)), y
    `acceptance_map` (object mapping strings to arrays of strings).
    Responde con exactamente un objeto JSON que coincida con PlanOutline,
    sin prosa ni bloques Markdown. Values must be valid JSON literals only.
    Do not use JavaScript or Python expressions such as `.replace(...)`. Do
    not invent localized key names. Do not add extra prose or Markdown.
  expected_output: >
    Un PlanOutline válido.


architect_artifact_task:
  description: >
    Produce exclusivamente la unidad de artefacto solicitada usando este
    TicketContract JSON:
    {ticket_contract_json}

    PlanOutline validado:
    {plan_outline_json}

    PlanUnitOutline solicitado:
    {plan_unit_outline_json}

    Contexto seleccionado para esta unidad:
    {project_context}

    Devuelve un PlanArtifactUnit que corresponda exactamente al artifact y
    capability solicitados. Si es design, debe declarar exactamente un
    verification_profile igual a PlanOutline.profile y declarar explícitamente
    Browser E2E: required o Browser E2E: not_required. Si es spec, debe usar los
    encabezados OpenSpec exactos ## ADDED Requirements, ## MODIFIED Requirements,
    ## REMOVED Requirements o ## RENAMED Requirements, y cada requisito debe
    contener al menos un escenario encabezado #### Scenario:. No uses herramientas,
    no escribas archivos y no calcules hashes: el supervisor
    persiste y valida el resultado.
    Contrato JSON exacto PlanArtifactUnit, con estas claves y tipos:
    `schema_version` (integer literal 1), `artifact` (string literal: proposal,
    design, tasks, or spec), optional
    `capability` (string or null), y `content` (string).
    Responde con exactamente un objeto JSON que coincida con PlanArtifactUnit,
    sin prosa ni bloques Markdown. Values must be valid JSON literals only.
    Do not use JavaScript or Python expressions such as `.replace(...)`. Do
    not invent localized key names. Do not add extra prose or Markdown.
  expected_output: >
    Un PlanArtifactUnit válido.


coding_task:
  description: >
    Lee el PlanManifest persistido en '{plan_manifest_path}' e implementa solo
    las tareas que mapea. Si '{repair_pack_path}' no es 'NONE', lee ese
    RepairPack y aplica su hint solo dentro de su scope. No ejecutes gates
    autoritativos ni modifiques los artefactos OpenSpec planificados: el
    supervisor conserva la responsabilidad y persiste TaskCompletion con el
    hash original de tasks.md después de una implementación exitosa.
  expected_output: >
    Archivos modificados, tareas completadas y estado conciso.
  agent: programer


testing_task:
  description: >
    Lee el perfil de verificación persistido en '{verification_profile_path}'
    y los escenarios persistidos en '{scenario_paths}'. Ejecuta solo los
    escenarios indicados cuando el perfil requiera Browser E2E; de otro modo
    devuelve status=skipped. No modifiques código ni inventes resultados.
    Contrato JSON exacto TesterResult, con estas claves y tipos: `status`
    (string literal: passed, failed, or skipped), `summary` (string), y
    `scenarios` (array of strings).
    Responde con exactamente un objeto JSON que coincida con TesterResult,
    sin prosa ni bloques Markdown. Values must be valid JSON literals only.
    Do not use JavaScript or Python expressions such as `.replace(...)`. Do
    not invent localized key names. Do not add extra prose or Markdown.
  expected_output: >
    Resultado estructurado con status, summary y scenarios.
  agent: tester


review_task:
  description: >
    Lee el ReviewPack persistido en '{review_pack_path}' y revisa únicamente
    los archivos y la evidencia que referencia. Devuelve approved solo si el
    pack sustenta cada criterio de aceptación; usa retryable_failure cuando
    Programmer puede corregirlo o blocked si requiere intervención humana.
    Contrato JSON exacto ReviewVerdict, con estas claves y tipos: `ticket_id`
    (string), `change_id` (string), `status` (string literal: approved,
    retryable_failure, or blocked), `failure_type` (string literal: none,
    implementation, test, infrastructure, configuration, requirements, or
    max_attempts),
    `failure_stage` (string or null), y `summary` (string).
    Responde con exactamente un objeto JSON que coincida con ReviewVerdict,
    sin prosa ni bloques Markdown. Values must be valid JSON literals only.
    Do not use JavaScript or Python expressions such as `.replace(...)`. Do
    not invent localized key names. Do not add extra prose or Markdown.
  expected_output: >
    Resultado estructurado con ticket_id, change_id, status,
    failure_type, failure_stage y summary.
  agent: reviewer
