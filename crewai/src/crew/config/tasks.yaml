analysis_task:
  description: >
    Usa obligatoriamente 'Buscar Tarea en Linear'
    para obtener el ticket '{ticket_id}'.

    Analiza:
    - título;
    - descripción;
    - objetivo;
    - alcance;
    - requisitos funcionales;
    - criterios de aceptación;
    - restricciones;
    - dependencias;
    - ambigüedades.

    No inventes requisitos, reglas de negocio ni criterios
    que no estén presentes en Linear.

    Si algo es ambiguo o contradictorio, indícalo.

    IMPORTANTE:
    Tu respuesta final debe ser CONCISA.
    No repitas innecesariamente toda la descripción del ticket.
    Resume solo la información necesaria para el Arquitecto.

  expected_output: >
    Resumen estructurado y conciso del ticket '{ticket_id}'
    con objetivo, alcance, requisitos, criterios de aceptación,
    restricciones y ambigüedades.

  agent: analyst


architecture_task:
  description: >
    Convierte el ticket '{ticket_id}' en el cambio OpenSpec
    '{change_id}'.

    PASO 1:
    Lee 'CONTEXT.md' usando 'Leer Archivo en Raiz'.

    PASO 2:
    Si necesitas inspeccionar el repositorio usa
    'Listar Archivos en Raiz'.

    NO inspecciones directorios generados como:
    .venv, node_modules, .git, .next, dist, build
    o __pycache__.

    Si necesitas listar la raíz usa:
    ruta_relativa="."
    profundidad_maxima=2

    Después inspecciona únicamente carpetas directamente
    relacionadas con el ticket.

    PASO 3:
    Usa 'Ejecutar OpenSpec' con:

    new change {change_id}

    Si el cambio ya existe, continúa trabajando sobre él.

    PASO 4:
    Crea mediante 'Escribir Archivo en Raiz':

    openspec/changes/{change_id}/proposal.md

    Debe definir:
    - problema;
    - objetivo;
    - alcance;
    - fuera de alcance;
    - impacto esperado.

    PASO 5:
    Crea las specs necesarias dentro de:

    openspec/changes/{change_id}/specs/

    Organízalas por dominio o capability.

    Deben representar todos los requisitos y criterios
    de aceptación relevantes.

    Los requisitos agregados deben usar el formato:

    ## ADDED Requirements

    ### Requirement: Nombre

    Descripción verificable.

    #### Scenario: Nombre

    - GIVEN ...
    - WHEN ...
    - THEN ...

    PASO 6:
    Crea:

    openspec/changes/{change_id}/design.md

    Debe describir solamente las decisiones técnicas
    necesarias para implementar las specs.

    PASO 7:
    Crea:

    openspec/changes/{change_id}/tasks.md

    Usa checkboxes Markdown.

    Cada tarea debe indicar:
    - archivo a crear o modificar;
    - cambio concreto;
    - tests necesarios cuando corresponda.

    PASO 8:
    Valida el cambio usando 'Ejecutar OpenSpec':

    validate {change_id} --strict --no-interactive

    Si falla, corrige los artifacts y vuelve a validar.

    IMPORTANTE:
    No devuelvas el contenido completo de proposal, specs,
    design o tasks en tu respuesta final.

    Esos documentos ya están guardados en disco.

    Tu respuesta final debe contener únicamente:
    - archivos creados;
    - resultado de OpenSpec validate;
    - problemas encontrados, si existen.

  expected_output: >
    Resumen breve indicando los artifacts creados para
    '{change_id}' y el resultado de OpenSpec validate.
    No debe repetir el contenido completo de los artifacts.

  agent: arquitect


coding_task:
  description: >
    Implementa el cambio OpenSpec '{change_id}'.

    PASO 1:
    Lee:

    openspec/changes/{change_id}/proposal.md

    openspec/changes/{change_id}/design.md

    openspec/changes/{change_id}/tasks.md

    PASO 2:
    Usa 'Listar Archivos en Raiz' únicamente sobre:

    openspec/changes/{change_id}/specs

    y lee cada spec encontrada.

    PASO 3:
    Interpreta:

    proposal = alcance

    specs = contrato funcional

    design = decisiones técnicas

    tasks = checklist de implementación

    PASO 4:
    Ejecuta las tareas de tasks.md en orden.

    Antes de modificar un archivo existente debes leerlo
    con 'Leer Archivo en Raiz'.

    Usa 'Escribir Archivo en Raiz' para crear o modificar
    archivos.

    PASO 5:
    Después de completar correctamente cada tarea,
    actualiza su checkbox en tasks.md:

    - [ ] -> - [x]

    PASO 6:
    No inspecciones:
    .venv, node_modules, .git, .next, dist, build
    ni __pycache__.

    No listes todo el repositorio salvo que sea estrictamente
    necesario.

    PASO 7:
    Al finalizar ejecuta mediante 'Ejecutar Verificacion':

    python

    lint

    test

    build

    Si una verificación falla, corrige el problema y vuelve
    a ejecutar la verificación correspondiente.

    IMPORTANTE:
    Tu respuesta final debe ser breve.

    NO pegues el código implementado.

    Devuelve únicamente:
    - archivos creados o modificados;
    - tareas completadas;
    - resultado de las verificaciones.

  expected_output: >
    Resumen breve de los archivos implementados,
    tareas completadas y resultados de python, lint,
    test y build.

  agent: programer


review_task:
  description: >
    Realiza la revisión final del cambio '{change_id}'.

    PASO 1:
    Lee:

    openspec/changes/{change_id}/proposal.md

    openspec/changes/{change_id}/design.md

    openspec/changes/{change_id}/tasks.md

    PASO 2:
    Lista únicamente:

    openspec/changes/{change_id}/specs

    y lee cada spec encontrada.

    PASO 3:
    Comprueba que:
    - todos los Requirements estén implementados;
    - todos los Scenarios estén cubiertos;
    - design se respete;
    - todas las tasks estén marcadas [x].

    Lee únicamente los archivos de código relevantes para
    comprobar estas condiciones.

    NO listes todo el repositorio.

    NO inspecciones:
    .venv, node_modules, .git, .next, dist, build
    ni __pycache__.

    PASO 4:
    Ejecuta mediante 'Ejecutar Verificacion':

    python

    lint

    test

    build

    Si cualquiera falla, NO archives el cambio.

    PASO 5:
    Ejecuta mediante 'Ejecutar OpenSpec':

    validate {change_id} --strict --no-interactive

    Si falla, NO archives.

    PASO 6:
    SOLO si todo es correcto ejecuta:

    archive {change_id} --yes

    PASO 7:
    Nunca inventes una confirmación de archivado.
    Usa el resultado real devuelto por OpenSpec.

    IMPORTANTE:
    Tu respuesta final debe ser breve.

    No pegues archivos completos ni logs extensos.

  expected_output: >
    Informe breve indicando si la revisión fue aprobada
    o rechazada. Si fue aprobada, incluye el resultado
    real del archivado OpenSpec.

  agent: reviewer
