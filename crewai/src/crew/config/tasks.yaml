analysis_task:
  description: >
    Usa obligatoriamente 'Buscar Tarea en Linear'
    para obtener '{ticket_id}'.

    El orquestador ya debió mover el ticket a In Progress.

    Analiza:
    - objetivo;
    - alcance;
    - requisitos funcionales;
    - criterios de aceptación;
    - restricciones;
    - dependencias;
    - ambigüedades.

    No inventes información.

    Si el ticket no puede recuperarse o contiene una
    ambigüedad que impide implementarlo, indícalo claramente.
  expected_output: >
    Resumen conciso del ticket con objetivo, alcance,
    requisitos, criterios de aceptación, restricciones
    y ambigüedades.
  agent: analyst


architecture_task:
  description: >
    Trabaja sobre el cambio OpenSpec '{change_id}'.

    Lee CONTEXT.md.

    Si '{last_attempt_path}' es distinto de 'NONE',
    lee también ese archivo y considera el fallo documentado.

    Inspecciona únicamente las partes relevantes del repositorio.

    No inspecciones:
    .venv, node_modules, .git, .next, dist, build,
    __pycache__, .playwright-cli.

    Crea o actualiza:
    - openspec/changes/{change_id}/proposal.md
    - openspec/changes/{change_id}/specs/
    - openspec/changes/{change_id}/design.md
    - openspec/changes/{change_id}/tasks.md

    proposal define alcance.

    specs define Requirements y Scenarios verificables.

    design define las decisiones técnicas.

    tasks usa checkboxes y debe indicar cambios concretos
    y tests cuando correspondan.

    design.md debe contener exactamente una estrategia:

    ## Verification Strategy
    - Browser E2E: required

    o:

    ## Verification Strategy
    - Browser E2E: not_required

    Incluye una razón breve.

    Usa required cuando exista comportamiento verificable
    mediante navegador: navegación, formularios,
    autenticación, UI o integración frontend/API visible.

    Finalmente ejecuta:

    validate {change_id} --strict --no-interactive

    Corrige los artifacts si falla.

    Nunca archives el cambio.
  expected_output: >
    Resumen de artifacts creados o actualizados y resultado
    de OpenSpec validate.
  agent: arquitect


coding_task:
  description: >
    Implementa el cambio OpenSpec '{change_id}'.

    Lee completamente:
    - proposal.md
    - design.md
    - tasks.md
    - todas las specs

    Si '{last_attempt_path}' es distinto de 'NONE',
    lee también el fallo anterior y corrige su causa.

    No debilites specs o criterios de aceptación para hacer
    desaparecer un fallo.

    Ejecuta tasks.md en orden.

    Antes de modificar un archivo existente debes leerlo.

    Marca [x] únicamente después de completar realmente
    la tarea.

    Al finalizar ejecuta:
    - python
    - lint
    - test
    - build

    Si una verificación falla por la implementación,
    corrige el problema y vuelve a ejecutarla.

    No archives OpenSpec y no modifiques Linear.
  expected_output: >
    Archivos modificados, tareas completadas y resultado
    de python, lint, test y build.
  agent: programer


testing_task:
  description: >
    Lee design.md y todas las specs de '{change_id}'.

    Si design.md contiene:

    Browser E2E: not_required

    no abras navegador y devuelve status=skipped.

    Si contiene:

    Browser E2E: required

    ejecuta este flujo:

    1. Usa 'Gestionar Entorno Local' con start.
    2. Obtén la URL devuelta.
    3. Usa 'Ejecutar Playwright' con open y esa URL.
    4. Usa snapshot --raw para inspeccionar la página.
    5. Ejecuta únicamente los Scenarios relevantes.
    6. Usa las verificaciones de Playwright cuando sea posible.
    7. Consulta console error o network cuando un fallo
       necesite diagnóstico.
    8. Cierra Playwright.
    9. Detén el entorno local.

    No uses MCP.
    No uses skills.
    No modifiques código.

    Si un Scenario falla:
    status=failed.

    Si todos pasan:
    status=passed.

    Nunca inventes un resultado.
  expected_output: >
    Resultado estructurado con status, summary y scenarios.
  agent: tester


review_task:
  description: >
    Realiza la revisión final de '{change_id}'.

    Lee:
    - proposal.md
    - design.md
    - tasks.md
    - todas las specs
    - código relevante

    Comprueba:
    - todos los Requirements implementados;
    - todos los Scenarios cubiertos;
    - design respetado;
    - todas las tasks marcadas [x].

    Ejecuta nuevamente:
    - python
    - lint
    - test
    - build

    Ejecuta:

    validate {change_id} --strict --no-interactive

    Considera también el resultado real del Tester.

    Si Browser E2E es required,
    Playwright debe estar passed.

    Si Browser E2E es not_required,
    Playwright puede estar skipped.

    Usa status=approved únicamente si todo es correcto.

    Usa status=retryable_failure cuando otra ejecución
    del Crew puede corregir el problema.

    Usa status=blocked cuando se requiere intervención humana
    por requisitos, configuración o dependencia externa.

    failure_type debe ser uno de:
    none
    implementation
    test
    infrastructure
    configuration
    requirements
    max_attempts

    Nunca archives OpenSpec.
    Nunca modifiques Linear.
  expected_output: >
    Resultado estructurado con ticket_id, change_id, status,
    failure_type, failure_stage, summary y verification.
  agent: reviewer
