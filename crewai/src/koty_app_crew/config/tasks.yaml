analysis_task:
  description: >
    Usa tu herramienta 'Buscar Tarea en Linear' para leer el ticket {ticket_id}.
    Extrae la descripción exacta y los criterios de aceptación.
  expected_output: >
    Un resumen de texto claro sobre lo que hay que construir.
  agent: analyst

architecture_task:
  description: >
    Tu deber es crear los planos técnicos respetando estrictamente el formato.
    
    ¡ALERTA CRÍTICA DE FORMATO JSON!: Cuando uses la herramienta 'Escribir Archivo en Raiz', 
    tu 'Action Input' DEBE ser un ÚNICO objeto JSON válido. Escapa saltos de línea con \n.
    
    PASO 1: Usa 'Leer Archivo en Raiz' para abrir '../CONTEXT.md' y extraer las reglas.
    
    PASO 2: Usa 'Ejecutar OpenSpec' con este comando exacto: new change "dev-5"
    
    PASO 3: Usa 'Escribir Archivo en Raiz' para rellenar openspec/changes/dev-5/proposal.md
    DEBES USAR ESTE FORMATO EXACTO Y NO OTRO:
    ## Why
    (Escribe aquí por qué se hace este cambio)
    ## What Changes
    (Escribe aquí qué va a cambiar)
    
    PASO 4: Usa 'Escribir Archivo en Raiz' para rellenar openspec/changes/dev-5/design.md
    
    PASO 5: Usa 'Escribir Archivo en Raiz' para crear openspec/changes/dev-5/specs/monorepo/spec.md
    DEBES USAR ESTE FORMATO EXACTO Y NO OTRO:
    ## ADDED Requirements
    ### Requirement: Inicializacion del Monorepo
    El sistema MUST inicializar el monorepo.
    #### Scenario: Creacion exitosa
    - WHEN se ejecuta el comando
    - THEN se crean los archivos
  expected_output: >
    Archivos creados con el formato Markdown estrictamente válido para OpenSpec, incluyendo la palabra MUST.
  agent: arquitect

coding_task:
  description: >
    Usa 'Leer Archivo en Raiz' para revisar el diseño. Escribe el código requerido.
    
    ¡ALERTA CRÍTICA DE FORMATO JSON!: Tu 'Action Input' DEBE ser un ÚNICO objeto JSON válido. 
    Escapa TODOS los saltos de línea en el código con \n y las comillas dobles internas con \".
    
    Usa 'Escribir Archivo en Raiz' para guardar CADA UNO de los archivos de código nuevos.
  expected_output: >
    Todos los archivos de código guardados en la raíz del repositorio.
  agent: programer

review_task:
  description: >
    Como Revisor, DEBES usar la herramienta 'Ejecutar OpenSpec'.
    Pásale exactamente este comando: archive dev-5
  expected_output: >
    El texto real que devuelva la terminal confirmando el archivado.
  agent: reviewer
