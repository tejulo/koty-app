[project]
name = "crew"
version = "0.1.0"
description = "crew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.15.16",
    "python-dotenv"
]

[project.scripts]
koty_app_crew = "crew.main:run"
run_crew = "crew.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targuts.wheel]
packages = ["src/crew"]

[tool.crewai]
type = "crew"
