[project]
name = "crew"
version = "0.1.0"
description = "crew using crewAI"
authors = [{ name = "Juan Mendoza", email = "juanmb86@gmail.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.15.16",
    "python-dotenv",
    "requests",
    "pydantic>=2,<3"
]

[project.scripts]
crew = "crew.main:run"
run_crew = "crew.main:run"
crew_queue = "crew.queue:run"
finalize_ticket = "crew.finalizer:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crew"]

[tool.crewai]
type = "crew"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
