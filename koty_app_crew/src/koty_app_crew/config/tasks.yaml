analysis_task:
  description: >
    Usa tu herramienta 'Buscar Tarea en Linear' para leer el ticket {ticket_id}.
    Extrae la descripción exacta y los criterios de aceptación.
  expected_output: >
    Un resumen de texto claro sobre lo que hay que construir.
  agent: analyst

architecture_task:
  description: >
    Lee el resumen del Analista. Tu deber es crear los planos técnicos.
    
    PASO 1: Usa tu herramienta 'Ejecutar OpenSpec' pasándole exactamente esto: new change "{ticket_id}"
    Esto creará una nueva carpeta para el ticket con plantillas en blanco.
    
    PASO 2: Usa la herramienta 'Escribir Archivo en Raiz' para rellenar con información técnica 
    los archivos 'proposal.md' y 'design.md' que OpenSpec acaba de crear para este cambio.
  expected_output: >
    Documentos de propuesta y diseño creados y guardados correctamente.
  agent: arquitect

coding_task:
  description: >
    Lee los documentos de diseño que acaba de crear el Arquitecto.
    Escribe el código requerido.
    Usa tu herramienta 'Escribir Archivo en Raiz' para guardar CADA UNO de los archivos de código nuevos.
    Solo pasa la ruta interna de la aplicación (ejemplo: 'apps/web/package.json') y el código.
  expected_output: >
    Todos los archivos de código guardados físicamente en la raíz del repositorio.
  agent: programer

review_task:
  description: >
    Revisa el código escrito por el Programador y compáralo con el diseño técnico.
    Si todo está correcto y cumple con los criterios, usa tu herramienta 'Ejecutar OpenSpec' 
    para archivar el cambio ejecutando el comando: archive <nombre-de-la-carpeta-de-cambio>
    para consolidar la documentación oficial de OpenSpec.
  expected_output: >
    Confirmación de que el código ha sido revisado y el cambio archivado exitosamente en OpenSpec.
  agent: reviewer
